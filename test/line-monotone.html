<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="lib/simpleRequire.js"></script>
        <script src="lib/config.js"></script>
        <script src="lib/jquery.min.js"></script>
        <script src="lib/facePrint.js"></script>
        <script src="lib/testHelper.js"></script>
        <link rel="stylesheet" href="lib/reset.css" />
    </head>
    <body>
        <style>
            html {
                line-height: 18px;
            }
        </style>

        <div id="main0"></div>
        <div id="main1"></div>
        <div id="main2"></div>


        <script>
            require([
                'echarts'
            ], function (echarts) {

                var categories = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun', 'Mon'];
                var samples = [20, 80, 82, 78, 30, 28, 90, 40];

                var option = {
                    animation: false,
                    color: ['#5470c6', '#fac858', '#ee6666', '#333'],
                    legend: {},
                    grid: {
                        left: 40,
                        right: 20,
                        bottom: 30
                    },
                    xAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: categories
                    },
                    yAxis: {
                        type: 'value',
                        min: 0,
                        max: 120
                    },
                    series: [{
                        name: 'Bezier',
                        type: 'line',
                        smooth: true,
                        showSymbol: false,
                        data: samples
                    }, {
                        name: 'Flat tangent',
                        type: 'line',
                        smooth: true,
                        smoothMonotone: 'x',
                        showSymbol: false,
                        data: samples
                    }, {
                        name: 'Monotone cubic',
                        type: 'line',
                        smooth: true,
                        smoothMonotone: 'monotoneX',
                        showSymbol: false,
                        data: samples
                    }, {
                        name: 'Samples',
                        type: 'line',
                        smooth: false,
                        symbol: 'circle',
                        symbolSize: 7,
                        z: 4,
                        lineStyle: {
                            type: 'dashed',
                            width: 1
                        },
                        data: samples
                    }]
                };

                testHelper.create(echarts, 'main0', {
                    title: [
                        'Peaked samples, three smoothers over the dashed line',
                        'Bezier may bow outside the samples.',
                        'Flat tangent (`smoothMonotone: "x"`) is horizontal at every sample.',
                        '**Monotone cubic** (`monotoneX`) passes through the samples and adds no peak between them.'
                    ],
                    option: option,
                    width: 700,
                    height: 360
                });
            });
        </script>

        <script>
            require([
                'echarts'
            ], function (echarts) {

                var categories = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

                var option = {
                    animation: false,
                    legend: {},
                    grid: {
                        left: 40,
                        right: 20,
                        bottom: 30
                    },
                    xAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: categories
                    },
                    yAxis: {
                        type: 'value'
                    },
                    series: [{
                        name: 'Base',
                        type: 'line',
                        stack: 'total',
                        smooth: true,
                        smoothMonotone: 'monotoneX',
                        showSymbol: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        areaStyle: {},
                        data: [10, 22, 28, 26, 40, 35, 20]
                    }, {
                        name: 'Upper',
                        type: 'line',
                        stack: 'total',
                        smooth: true,
                        smoothMonotone: 'monotoneX',
                        showSymbol: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        areaStyle: {},
                        data: [12, 18, 16, 30, 28, 22, 14]
                    }]
                };

                testHelper.create(echarts, 'main1', {
                    title: [
                        'Stacked area with `smoothMonotone: "monotoneX"`',
                        'Each boundary passes through its stacked samples.',
                        'The fill should not grow a peak or a valley between those samples.'
                    ],
                    option: option,
                    width: 700,
                    height: 360
                });
            });
        </script>

        <script>
            require([
                'echarts'
            ], function (echarts) {

                var categories = ['A', 'B', 'C', 'D', 'E', 'F'];

                var option = {
                    animation: false,
                    color: ['#5470c6', '#ee6666', '#333'],
                    legend: {},
                    grid: {
                        left: 40,
                        right: 20,
                        bottom: 30
                    },
                    yAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: categories
                    },
                    xAxis: {
                        type: 'value',
                        min: 0,
                        max: 140
                    },
                    series: [{
                        name: 'Bezier',
                        type: 'line',
                        smooth: true,
                        showSymbol: false,
                        data: [20, 80, 82, 30, 90, 40]
                    }, {
                        name: 'Monotone cubic',
                        type: 'line',
                        smooth: true,
                        smoothMonotone: 'monotoneY',
                        showSymbol: false,
                        data: [20, 80, 82, 30, 90, 40]
                    }, {
                        name: 'Samples',
                        type: 'line',
                        smooth: false,
                        symbol: 'circle',
                        symbolSize: 7,
                        z: 4,
                        lineStyle: {
                            type: 'dashed',
                            width: 1
                        },
                        data: [20, 80, 82, 30, 90, 40]
                    }]
                };

                testHelper.create(echarts, 'main2', {
                    title: [
                        'Category on y, `smoothMonotone: "monotoneY"`',
                        'The red monotone curve follows the samples without an extra bend between them.',
                        'The blue Bézier may still bow past a sample.'
                    ],
                    option: option,
                    width: 700,
                    height: 360
                });
            });
        </script>

    </body>
</html>
