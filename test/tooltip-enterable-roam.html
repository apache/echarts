<html>
<head>
    <meta charset="utf-8">
    <script src="lib/simpleRequire.js"></script>
    <script src="lib/config.js"></script>
</head>
<body>
    <p>Hold the mouse on the graph background, move onto the tooltip, then release.
        Moving back must not pan. Repeat, including release on a tooltip child or outside the chart.</p>
    <label>Renderer <select id="renderer"><option>canvas</option><option>svg</option></select></label>
    <label><input id="external" type="checkbox">External appendTo</label>
    <label><input id="nested" type="checkbox">Append inside renderer</label>
    <label><input id="stop-release" type="checkbox">Child stops release bubbling</label>
    <label><input id="enterable" type="checkbox" checked>Enterable</label>
    <button id="reset">Reset / show tooltip</button>
    <div id="main" style="width:700px;height:500px;border:1px solid #ccc"></div>
    <div id="external-container"></div>
    <p id="status">Tooltip button clicks: 0</p>
    <div id="link-target">Tooltip link target</div>
    <script>
        require(['echarts'], function (echarts) {
            var chart;
            var clicks = 0;
            function reset() {
                if (chart) { chart.dispose(); }
                chart = echarts.init(document.getElementById('main'), null, {
                    renderer: document.getElementById('renderer').value
                });
                chart.setOption({
                    animation: false,
                    tooltip: {
                        enterable: document.getElementById('enterable').checked,
                        appendTo: document.getElementById('nested').checked
                            ? chart.getZr().painter.getViewportRoot()
                            : document.getElementById('external').checked
                                ? document.getElementById('external-container') : undefined,
                        alwaysShowContent: true,
                        position: [360, 180],
                        formatter: function () {
                            var content = document.createElement('div');
                            content.innerHTML = '<button id="tip-button"><span>Click child</span></button>'
                                + ' <a id="tip-link" href="#link-target">Link</a>'
                                + '<p id="tip-text" style="user-select:text">Select this tooltip text</p>';
                            if (document.getElementById('stop-release').checked) {
                                var child = content.querySelector('span');
                                child.onmouseup = child.onpointerup = function (event) {
                                    event.stopPropagation();
                                };
                            }
                            content.querySelector('button').onclick = function () {
                                document.getElementById('status').textContent = 'Tooltip button clicks: ' + (++clicks);
                            };
                            return content;
                        }
                    },
                    series: [{
                        type: 'graph', layout: 'none', roam: true,
                        data: [{name: 'a', x: 0, y: 0}, {name: 'b', x: 100, y: 100}]
                    }]
                });
                chart.dispatchAction({type: 'showTip', seriesIndex: 0, dataIndex: 0});
            }
            document.getElementById('reset').onclick = reset;
            reset();
        });
    </script>
</body>
</html>
