<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="lib/simpleRequire.js"></script>
        <script src="lib/config.js"></script>
        <script src="lib/jquery.min.js"></script>
        <script src="lib/facePrint.js"></script>
        <script src="lib/testHelper.js"></script>
        <!-- <script src="lib/canteen.js"></script> -->
        <!-- <script src="lib/draggable.js"></script> -->
        <link rel="stylesheet" href="lib/reset.css" />
    </head>
    <body>
        <style>
            body { max-width: 800px; }
            .pair { display: flex; }
            .case { width: 400px; }
        </style>
        <div class="pair">
            <div class="case"><div id="main0"></div></div>
            <div class="case"><div id="main1"></div></div>
        </div>
        <div id="main2"></div>
        <script>
            require(['echarts'], function (echarts) {
                function makeOption() {
                    return {
                        animation: false,
                        grid: {left: 55, right: 60, top: 50, bottom: 40},
                        xAxis: {type: 'value', min: 0, max: 1},
                        yAxis: [
                            {min: -100, max: 100},
                            {min: -300, max: 300, position: 'right'}
                        ],
                        dataZoom: {
                            type: 'inside', yAxisIndex: 'all',
                            rangeMode: ['value', 'value'], filterMode: 'none'
                        },
                        series: [{type: 'line', yAxisIndex: 1, data: [[0, -300], [1, 300]], symbolSize: 10}]
                    };
                }

                var original = testHelper.create(echarts, 'main0', {
                    title: ['Original chart', 'Right axis should show -300 to 300.'],
                    width: 400,
                    height: 300,
                    option: makeOption()
                });
                var recovered = testHelper.create(echarts, 'main1', {
                    title: ['Unchanged getOption recovery', 'Both endpoints should remain visible.'],
                    width: 400,
                    height: 300,
                    option: original.getOption(),
                    buttons: [{
                        text: 'Recover again',
                        onclick: function () {
                            recovered.setOption(recovered.getOption(), {notMerge: true});
                        }
                    }]
                });
                var emptyOption = makeOption();
                emptyOption.series = [];
                var added = testHelper.create(echarts, 'main2', {
                    title: [
                        'Add a series using full option replacement, issue #21408',
                        'Click Add series. The right axis should remain -300 to 300, with both endpoints visible.',
                        'Click Full percent zoom or scroll inside the chart. The range should change consistently.'
                    ],
                    width: 800,
                    height: 300,
                    option: emptyOption,
                    buttons: [{
                        text: 'Add series',
                        onclick: function () {
                            var replacement = added.getOption();
                            replacement.series = makeOption().series;
                            added.setOption(replacement, {notMerge: true});
                        }
                    }, {
                        text: 'Full percent zoom',
                        onclick: function () {
                            added.dispatchAction({type: 'dataZoom', start: 0, end: 100});
                        }
                    }]
                });
            });
        </script>
    </body>
</html>
