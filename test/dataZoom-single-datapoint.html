<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="lib/simpleRequire.js"></script>
        <script src="lib/config.js"></script>
        <script src="lib/jquery.min.js"></script>
        <script src="lib/facePrint.js"></script>
        <script src="lib/testHelper.js"></script>
        <!-- <script src="lib/canteen.js"></script> -->
        <!-- <script src="lib/draggable.js"></script> -->
        <link rel="stylesheet" href="lib/reset.css" />
    </head>
    <body>
        <style>
            html {
                /* Fix the line-height to integer to avoid it varying across clients and
                   causing visual test failures. Some clients may not support fractional px. */
                line-height: 18px;
            }
            #main0, #main1, #main2, #main3 {
                width: 800px;
                margin: 0 auto;
            }
        </style>

        <div id="main0"></div>
        <div id="main1"></div>
        <div id="main2"></div>
        <div id="main3"></div>

        <script>
            require(['echarts'], function (echarts /*, data */) {
                var option = {
                    animation: false,
                    dataZoom: {},
                    xAxis: {
                        type: 'time'
                    },
                    yAxis: {
                        show: false,
                        type: 'value',
                        min: 0,
                        max: 100
                    },
                    series: [
                        {
                            animation: false,
                            name: 'Test',
                            type: 'bar',
                            barWidth: 4,
                            data: [
                                {
                                    timestamp: 1753548900000,
                                    value: [1753548900000, 50, 0]
                                },
                            ],
                            dimensions: ['timestamp', 'value'],
                            encode: {
                                x: 0,
                                y: 1
                            }
                        }
                    ]
                };

                var chart = testHelper.create(echarts, 'main0', {
                    title: [
                        'Position of dataZoom when there is only one data point',
                    ],
                    option: option,
                });

                function makeDataShadowOption(axisType, data) {
                    return {
                        animation: false,
                        grid: {
                            left: 60,
                            right: 30,
                            top: 25,
                            bottom: 65
                        },
                        xAxis: {
                            type: axisType
                        },
                        yAxis: {
                            type: 'value',
                            min: 0,
                            max: 100
                        },
                        dataZoom: [{
                            type: 'slider',
                            showDataShadow: true,
                            showDetail: false,
                            start: 0,
                            end: 100,
                            height: 30,
                            bottom: 15,
                            dataBackground: {
                                lineStyle: {
                                    color: '#c23531',
                                    width: 2
                                },
                                areaStyle: {
                                    color: '#c23531',
                                    opacity: 0.4
                                }
                            },
                            selectedDataBackground: {
                                lineStyle: {
                                    color: '#c23531',
                                    width: 2
                                },
                                areaStyle: {
                                    color: '#c23531',
                                    opacity: 0.4
                                }
                            }
                        }],
                        series: [{
                            type: 'line',
                            symbolSize: 8,
                            data: data
                        }]
                    };
                }

                testHelper.create(echarts, 'main1', {
                    title: [
                        'Single-point series on a time axis with showDataShadow',
                        'The slider shadow must render at the left edge (no blank/NaN shadow).'
                    ],
                    height: 220,
                    option: makeDataShadowOption('time', [
                        [+new Date('2024-01-01'), 42]
                    ])
                });

                testHelper.create(echarts, 'main2', {
                    title: [
                        'Multi-point series on a time axis with showDataShadow',
                        'The slider shadow should still render across the slider.'
                    ],
                    height: 220,
                    option: makeDataShadowOption('time', [
                        [+new Date('2024-01-01'), 30],
                        [+new Date('2024-01-02'), 70],
                        [+new Date('2024-01-03'), 45]
                    ])
                });

                testHelper.create(echarts, 'main3', {
                    title: [
                        'Single-point series on a value axis with showDataShadow',
                        'The slider shadow should keep rendering at the left edge.'
                    ],
                    height: 220,
                    option: makeDataShadowOption('value', [
                        [0, 42]
                    ])
                });
            });
        </script>
    </body>
</html>
