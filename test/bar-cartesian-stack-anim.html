<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="lib/simpleRequire.js"></script>
        <script src="lib/config.js"></script>
        <script src="lib/jquery.min.js"></script>
        <script src="lib/facePrint.js"></script>
        <script src="lib/testHelper.js"></script>
        <link rel="stylesheet" href="lib/reset.css">
    </head>
    <body>
        <script>
        require(['echarts'], function (echarts) {
            [false, true].forEach(function (horizontal) {
                [false, true].forEach(function (inverse) {
                    var id = 'legend-' + horizontal + '-' + inverse;
                    var container = document.createElement('div');
                    container.id = id;
                    document.body.appendChild(container);
                    var values = [3, 2, 4];
                    function series() {
                        return values.map(function (value, index) {
                            return {
                                name: ['A', 'B', 'C'][index],
                                type: 'bar',
                                stack: 'a',
                                data: [value, -value]
                            };
                        });
                    }
                    var option = {
                        animationDuration: 3000,
                        animationDurationUpdate: 1200,
                        animationEasing: 'linear',
                        animationEasingUpdate: 'cubicInOut',
                        legend: {},
                        xAxis: horizontal ? {inverse: inverse} : {data: ['positive', 'negative']},
                        yAxis: horizontal ? {data: ['positive', 'negative']} : {inverse: inverse},
                        series: series()
                    };
                    var chart = testHelper.create(echarts, id, {
                        title: [
                            'Stack animation: ' + (horizontal ? 'horizontal' : 'vertical') + ', inverse=' + inverse,
                            'Hide and show B, including while its previous animation is still running.',
                            '**B should grow between A and C**, keeping both boundaries attached as the axes rescale.',
                            'Replay and update data: all adjacent segments should stay attached during animation.'
                        ],
                        option: option,
                        buttons: [{
                            text: 'Toggle B',
                            onclick: function () {
                                chart.dispatchAction({type: 'legendToggleSelect', name: 'B'});
                            }
                        }, {
                            text: 'Update data',
                            onclick: function () {
                                values = values[0] === 3 ? [4, 1, 2] : [3, 2, 4];
                                chart.setOption({series: series()});
                            }
                        }, {
                            text: 'Replay entrance',
                            onclick: function () {
                                chart.clear();
                                chart.setOption(option);
                            }
                        }]
                    });
                });
            });
        });
        </script>

    </body>
</html>
