<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="lib/simpleRequire.js"></script>
        <script src="lib/config.js"></script>
        <script src="lib/jquery.min.js"></script>
        <script src="lib/testHelper.js"></script>
        <link rel="stylesheet" href="lib/reset.css" />
    </head>
    <body>
        <div id="main0"></div>
        <div id="main1"></div>

        <script>
            require(['echarts'], function (echarts) {
                var series = [
                    { name: 'Housing', data: [30, 20, 40, 10] },
                    { name: 'Food', data: [20, 35, 25, 40] },
                    { name: 'Transport', data: [15, 10, 20, 25] },
                    { name: 'Other', data: [35, 35, 15, 25] }
                ];

                function makeOption(stackGap) {
                    return {
                        animation: false,
                        title: { text: stackGap ? 'With stackGap' : 'Default stacked bars', left: 'center' },
                        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                        legend: { top: 28 },
                        grid: { top: 68, bottom: 32 },
                        xAxis: { type: 'category', data: ['Q1', 'Q2', 'Q3', 'Q4'] },
                        yAxis: { type: 'value', min: 0, max: 100 },
                        series: series.map(function (item) {
                            return {
                                type: 'bar',
                                name: item.name,
                                stack: 'total',
                                stackGap: stackGap || 0,
                                itemStyle: { borderRadius: 2 },
                                data: item.data
                            };
                        })
                    };
                }

                testHelper.create(echarts, 'main0', {
                    title: 'Stacked bar segments with the default 0px gap.',
                    option: makeOption(0)
                });

                testHelper.create(echarts, 'main1', {
                    title: 'With stackGap: 8, only interior edges separate; baseline and stack tops stay fixed.',
                    option: makeOption(8)
                });
            });
        </script>
    </body>
</html>
