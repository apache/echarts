<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="lib/simpleRequire.js"></script>
        <script src="lib/config.js"></script>
        <script src="lib/jquery.min.js"></script>
        <script src="lib/facePrint.js"></script>
        <script src="lib/testHelper.js"></script>
        <!-- <script src="ut/lib/canteen.js"></script> -->
        <link rel="stylesheet" href="lib/reset.css" />
    </head>
    <body>
        <style>
        </style>

        <div id="main1"></div>
        <div id="main2"></div>
        <div id="main3"></div>

        <script>
        require([
            'echarts',
            './data/flare.json'
        ], function (echarts, data) {
            const option1 = {
                tooltip: {
                    trigger: 'item',
                    triggerOn: 'mousemove'
                },
                series:[
                    {
                        type: 'tree',
                        data: [data],
                        top: '18%',
                        bottom: '14%',
                        roam: true,
                        layout: 'radial',
                        symbol: 'emptyCircle',
                        symbolSize: 7,
                        initialTreeDepth: 3,
                        animationDurationUpdate: 750
                    }
                ]
            };

            const chart1 = testHelper.create(echarts, 'main1', {
                title: [
                    'test the radial tree',
                ],
                option: option1
            });
        });
        </script>

        <script>
            require([
                'echarts',
            ], function (echarts) {
                const option2 = {
                    tooltip: {
                        trigger: 'item'
                    },
                    series:[
                        {
                            type: 'tree',
                            data: [{
                                name: 'root'
                            }],
                            top: '18%',
                            bottom: '14%',
                            roam: true,
                            layout: 'radial',
                            symbol: 'emptyCircle',
                            symbolSize: 50,
                            initialTreeDepth: 3,
                            animationDurationUpdate: 750
                        }
                    ]
                };

                const chart2 = testHelper.create(echarts, 'main2', {
                    title: [
                        'Only root with the radial tree',
                    ],
                    option: option2
                });
            });
            </script>
        <script>
        require(['echarts'], function (echarts) {
            const data = {
                name: 'Root',
                children: [{
                    name: 'Branch',
                    children: [{
                        name: 'Twig',
                        children: [{name: 'Deep leaf'}]
                    }, {name: 'Leaf A'}]
                }, {
                    name: 'Short branch',
                    children: [{name: 'Leaf B'}]
                }, {name: 'Leaf C'}]
            };

            testHelper.create(echarts, 'main3', {
                height: 460,
                title: [
                    'Radial level spacing: automatic (left) vs radialLevelGap: [90, 25, 45] (right)',
                    'Gaps are CSS pixels between node centres, not edge lengths or label margins.',
                    'Index 0 is Root → children; later entries control successive depths. Missing entries use automatic gaps.',
                    'The root stays at radius 0 and angles are unchanged. Resize: explicit gaps stay fixed.'
                ],
                option: {
                    animation: false,
                    tooltip: {trigger: 'item'},
                    title: [{
                        text: 'Default automatic spacing',
                        left: '25%',
                        top: 15,
                        textAlign: 'center',
                        textStyle: {fontSize: 14}
                    }, {
                        text: 'Custom gaps: 90 / 25 / 45 px',
                        left: '75%',
                        top: 15,
                        textAlign: 'center',
                        textStyle: {fontSize: 14}
                    }],
                    series: [undefined, [90, 25, 45]].map(function (gap, index) {
                        return {
                            type: 'tree',
                            layout: 'radial',
                            radialLevelGap: gap,
                            data: [data],
                            left: index === 0 ? '5%' : '55%',
                            width: '40%',
                            top: 60,
                            bottom: 40,
                            initialTreeDepth: -1,
                            expandAndCollapse: false,
                            symbolSize: 9,
                            label: {fontSize: 11},
                            lineStyle: {width: 2}
                        };
                    })
                }
            });
        });
        </script>
    </body>
</html>
